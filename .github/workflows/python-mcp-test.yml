name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev --extra auth-ref --python ${{ matrix.python-version }}

      - name: Run tests with pytest
        # Override the local timing-test default: CI validates every test category.
        run: |
          junit_args=()
          if [[ "${{ matrix.python-version }}" == "3.14" ]]; then
            junit_args=(--junitxml=pytest-junit.xml -o junit_duration_report=call)
          fi
          uv run --locked --no-sync --no-build pytest tests/ -v -Walways -m "not timing or timing" "${junit_args[@]}"
        env:
          NO_COLOR: "1"
          TERM: "dumb"

      - name: Upload test timing report
        if: ${{ always() && matrix.python-version == '3.14' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-timings-python-3.14
          path: pytest-junit.xml
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --no-build --dev --extra auth-ref --python 3.14

      - name: Lint with Ruff
        run: uv run --locked --no-sync --no-build ruff check

      - name: Check formatting with Ruff
        run: uv run --locked --no-sync --no-build ruff format --check src/ tests/ --exclude '*.md'

      - name: Type check with Ty
        run: uv run --locked --no-sync --no-build ty check src/
