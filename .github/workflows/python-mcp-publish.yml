name: Publish Python MCP Package

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Show release actions without publishing
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark GitHub release as a pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Publishing is allowed only from main; received ${GITHUB_REF}." >&2
          exit 1

      - name: Record release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read package version
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify successful test workflow for release commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "python-mcp-test.yml",
              head_sha: process.env.RELEASE_SHA,
              status: "completed",
              per_page: 100,
            });
            const successfulRun = data.workflow_runs.find(
              (run) => run.conclusion === "success" && run.event === "push" && run.head_branch === "main",
            );
            if (!successfulRun) {
              core.setFailed(
                `No successful python-mcp-test.yml push run for release commit ${process.env.RELEASE_SHA} was found.`,
              );
            }

      - name: Require an unreleased version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ steps.version.outputs.value }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setFailed(`GitHub Release ${tag} already exists.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.setFailed(`Git tag ${tag} already exists.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Validate changelog entry
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(?P<body>.*?)(?=^## \[|\Z)"
          match = re.search(pattern, changelog, re.MULTILINE | re.DOTALL)
          if match is None or not match.group("body").strip():
              raise SystemExit(
                  f"Changelog section for version {version} is missing or empty. "
                  f"Add a '## [{version}]' section before publishing."
              )
          notes = match.group("body").strip()
          if re.search(r"(?:a|b|rc)\d+$", version):
              notes = f"**Note**: This is a pre-release version ({version})\n\n{notes}"
          Path("release-notes.md").write_text(f"{notes}\n", encoding="utf-8")
          PY

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  build-package:
    needs: verify-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release.outputs.commit_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build package
        run: uv build

      - name: Upload package distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-distributions
          path: dist/

  publish-docker:
    needs: verify-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release.outputs.commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: ${{ inputs.dry-run != true }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        if: ${{ inputs.dry-run != true }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PYTHON_VERSION=${{ vars.PYTHON_VERSION || '3.14' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mcp-guide:${{ needs.verify-release.outputs.version }}
            ${{ inputs.prerelease != true && format('{0}/mcp-guide:latest', secrets.DOCKERHUB_USERNAME) || '' }}

      - name: Show Docker commands
        if: ${{ inputs.dry-run == true }}
        run: |
          echo "Would execute:"
          printf '%s \\\n' "docker buildx build --platform linux/amd64,linux/arm64"
          printf '%s \\\n' "  --build-arg PYTHON_VERSION=${{ vars.PYTHON_VERSION || '3.14' }}"
          printf '%s \\\n' "  --tag <dockerhub-username>/mcp-guide:${{ needs.verify-release.outputs.version }}"
          if [ "${{ inputs.prerelease }}" != "true" ]; then
            printf '%s \\\n' "  --tag <dockerhub-username>/mcp-guide:latest"
          fi
          printf '%s\n' "  --push -f docker/Dockerfile ."

  publish-pypi:
    needs: [verify-release, build-package]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-distributions
          path: dist/

      - name: Publish to PyPI
        if: ${{ inputs.dry-run != true }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

      - name: Show PyPI commands
        if: ${{ inputs.dry-run == true }}
        run: |
          echo "Would execute:"
          echo "twine upload dist/*"
          ls -lh dist/

  create-release:
    needs: [verify-release, publish-docker, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: .

      - name: Create GitHub Release
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.commit_sha }}
          VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Would create GitHub Release v${VERSION} for ${RELEASE_SHA}."
            cat release-notes.md
            exit 0
          fi

          arguments=("v${VERSION}" --target "$RELEASE_SHA" --title "Release v${VERSION}" --notes-file release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            arguments+=(--prerelease)
          else
            arguments+=(--latest)
          fi
          gh release create "${arguments[@]}" --repo "$GITHUB_REPOSITORY"
